<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórias para Crianças</title>
  <style>
    :root {
      --bg: #0d0d12;
      --bg2: #13120f;
      --bg3: #1c1a14;
      --bg4: #252218;
      --border: #2e2a1e;
      --accent: #f59e0b;
      --accent2: #d97706;
      --accent3: #fbbf24;
      --text: #f0ead8;
      --muted: #9a9070;
      --paper: #1e1b14;
      --paper2: #252218;
      --green: #4ade80;
      --red: #f87171;
      --blue: #60a5fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, serif;
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .btn-voltar {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s;
      white-space: nowrap;
    }
    .btn-voltar:hover { border-color: var(--accent); color: var(--accent); }
    header .logo { font-size: 26px; }
    header h1 { font-size: 17px; font-weight: 700; color: var(--accent3); }
    header p { font-size: 12px; color: var(--muted); }

    /* ─── MAIN ─── */
    main { max-width: 780px; margin: 0 auto; padding: 28px 16px 60px; }

    /* ─── SECTION TITLE ─── */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 12px;
    }

    /* ─── AGE TABS ─── */
    .age-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .age-tab {
      flex: 1;
      min-width: 90px;
      padding: 14px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .age-tab .tab-num { font-size: 22px; font-weight: 700; }
    .age-tab .tab-label { font-size: 11px; }
    .age-tab:hover { border-color: var(--accent); color: var(--text); }
    .age-tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: var(--accent);
      color: #000;
      box-shadow: 0 4px 20px rgba(245,158,11,.3);
    }

    /* ─── GERAR BUTTON ─── */
    .gerar-section { text-align: center; margin: 24px 0; }
    .btn-gerar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      border: none;
      padding: 16px 40px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 24px rgba(245,158,11,.35);
      letter-spacing: .3px;
    }
    .btn-gerar:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 32px rgba(245,158,11,.45); }
    .btn-gerar:active { transform: translateY(0); }
    .btn-gerar.loading { opacity: .7; cursor: wait; }

    /* ─── STORY CARD ─── */
    #historia-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin: 28px 0;
      display: none;
      animation: fadeIn .4s ease;
      position: relative;
      overflow: hidden;
    }
    #historia-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
    }
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

    .historia-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .badge-idade {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .badge-tema {
      background: var(--bg4);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    #historia-titulo {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent3);
      margin-bottom: 20px;
      line-height: 1.3;
    }
    #historia-texto {
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text);
      white-space: pre-wrap;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #historia-moral {
      margin-top: 24px;
      padding: 14px 18px;
      background: var(--bg4);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: var(--accent3);
      font-style: italic;
      display: none;
    }
    .historia-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .btn-action {
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg4);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action:hover { border-color: var(--accent); color: var(--accent); }
    .btn-action.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      border-color: transparent;
      font-weight: 600;
    }
    .btn-action.primary:hover { filter: brightness(1.1); color: #000; }

    /* ─── SAVE TOAST ─── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--green);
      color: #000;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9000;
      transition: transform .3s ease;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── LIBRARY ─── */
    .biblioteca-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 40px 0 16px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .biblioteca-header h2 { font-size: 18px; font-weight: 700; color: var(--accent3); }
    .biblioteca-count {
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
    }
    #biblioteca-vazia {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 20px;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
    #biblioteca-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .story-book-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .story-book-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
    .story-book-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 4px; height: 100%;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
    }
    .card-titulo {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      padding-left: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 8px;
      flex-wrap: wrap;
    }
    .card-badge {
      background: rgba(245,158,11,.15);
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .card-date {
      color: var(--muted);
      font-size: 11px;
    }
    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-left: 8px;
    }
    .card-btn {
      flex: 1;
      padding: 7px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg4);
      color: var(--muted);
      font-size: 11px;
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .card-btn:hover { border-color: var(--accent); color: var(--accent); }
    .card-btn.del:hover { border-color: var(--red); color: var(--red); }

    /* ─── MODAL ─── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5000;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(6px);
      padding: 20px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }
    #modal.open { display: flex; }
    .modal-box {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 18px;
      max-width: 680px;
      width: 100%;
      margin: auto;
      padding: 36px;
      position: relative;
      animation: fadeIn .3s ease;
      overflow: hidden;
    }
    .modal-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--bg4);
      border: 1px solid var(--border);
      color: var(--muted);
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .modal-close:hover { border-color: var(--red); color: var(--red); }
    #modal-meta { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    #modal-titulo { font-size: 22px; font-weight: 700; color: var(--accent3); margin-bottom: 22px; line-height: 1.3; }
    #modal-texto {
      font-size: 15px;
      line-height: 1.85;
      white-space: pre-wrap;
      font-family: Georgia, serif;
      color: var(--text);
    }
    #modal-moral {
      margin-top: 22px;
      padding: 14px 18px;
      background: var(--bg4);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 13.5px;
      color: var(--accent3);
      font-style: italic;
      display: none;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 520px) {
      main { padding: 20px 12px 48px; }
      #historia-card { padding: 22px 18px; }
      .modal-box { padding: 24px 18px; }
      #historia-titulo { font-size: 19px; }
    }
  </style>
</head>
<body>

<header>
  <a class="btn-voltar" href="index.html">← Voltar</a>
  <div class="logo">📖</div>
  <div>
    <h1>Histórias para Crianças</h1>
    <p>Gera histórias únicas e guarda-as para ler quando quiseres</p>
  </div>
</header>

<main>
  <!-- AGE TABS -->
  <div class="section-title">Escolhe a idade</div>
  <div class="age-tabs">
    <button class="age-tab active" data-age="3" onclick="selectAge(3)">
      <span class="tab-num">3</span>
      <span class="tab-label">anos</span>
    </button>
    <button class="age-tab" data-age="5" onclick="selectAge(5)">
      <span class="tab-num">5</span>
      <span class="tab-label">anos</span>
    </button>
    <button class="age-tab" data-age="8" onclick="selectAge(8)">
      <span class="tab-num">8</span>
      <span class="tab-label">anos</span>
    </button>
    <button class="age-tab" data-age="11" onclick="selectAge(11)">
      <span class="tab-num">11</span>
      <span class="tab-label">anos</span>
    </button>
  </div>

  <!-- GENERATE BUTTON -->
  <div class="gerar-section">
    <button class="btn-gerar" id="btn-gerar" onclick="gerarHistoria()">✨ Gerar História</button>
  </div>

  <!-- STORY CARD -->
  <div id="historia-card">
    <div class="historia-meta">
      <span class="badge-idade" id="badge-idade"></span>
    </div>
    <h2 id="historia-titulo"></h2>
    <div id="historia-texto"></div>
    <div id="historia-moral"></div>
    <div class="historia-actions">
      <button class="btn-action primary" onclick="guardarHistoria()">💾 Guardar na Biblioteca</button>
      <button class="btn-action" onclick="downloadHistoria()">📥 Descarregar .txt</button>
      <button class="btn-action" onclick="gerarHistoria()">🔄 Nova História</button>
    </div>
  </div>

  <!-- LIBRARY -->
  <div class="biblioteca-header">
    <h2>📚 A Minha Biblioteca</h2>
    <span class="biblioteca-count" id="biblioteca-count">0 histórias</span>
  </div>
  <div id="biblioteca-vazia">
    <p>📖</p>
    <p style="margin-top:8px">Ainda não guardaste nenhuma história.<br>Gera uma e clica em "Guardar na Biblioteca"!</p>
  </div>
  <div id="biblioteca-grid"></div>
</main>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="fecharModal()">✕</button>
    <div id="modal-meta"></div>
    <h2 id="modal-titulo"></h2>
    <div id="modal-texto"></div>
    <div id="modal-moral"></div>
    <div class="modal-actions">
      <button class="btn-action primary" onclick="downloadModalHistoria()">📥 Descarregar .txt</button>
      <button class="btn-action" onclick="fecharModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

// ─── UTILITIES ───
const pick = a => a[Math.floor(Math.random() * a.length)];
const STORAGE_KEY = 'historias_criancas_v1';
let idadeAtual = 3;
let historiaAtual = null;
let modalHistoria = null;

// ─── STORY GENERATORS ───

// Pools comuns
const NOMES_M = ['Tito','Pipo','Rui','Leo','Marco','Dino','Bruno','Alex','Gil','Nuno'];
const NOMES_F = ['Luna','Mia','Bela','Lena','Ada','Zara','Bia','Iris','Eva','Nora'];
const ANIMAIS_SIMPLES = ['coelhinho','gatinho','cãozinho','ursinho','pintainho','ouriçinho','ratinho','patoinho'];
const CORES = ['azul','verde','amarela','cor-de-rosa','laranja','roxa','dourada'];
const FLORES = ['margaridas','rosas','malmequeres','violetas','girassóis'];
const ALIMENTOS = ['mel','frutos silvestres','cenouras','maçãs','bolachas de aveia'];

// ─── IDADE 3 ───
const g3 = [

  () => {
    const nome = pick([...NOMES_M, ...NOMES_F]);
    const animal = pick(ANIMAIS_SIMPLES);
    const local = pick(['jardim cheio de flores','floresta acolhedora','prado verde']);
    const amigo = pick(['uma joaninha','uma borboleta colorida','um grilo pequenino','uma lesma simpática']);
    const objeto = pick(['uma bola mágica','uma flor especial','uma maçã vermelha','um cogumelo encantado']);
    return {
      titulo: `${nome} e o Presente Inesperado`,
      texto: `Era uma vez um ${animal} chamado ${nome} que vivia num ${local}.

Um dia, enquanto brincava, ${nome} encontrou ${objeto} no chão.

— Que bonito! — disse ${nome}, todo contente.

Mas então apareceu ${amigo}, com os olhos muito tristes.

— O que aconteceu? — perguntou ${nome}.

— Perdi o meu brinquedo favorito — respondeu ${amigo} com um suspiro.

${nome} olhou para ${objeto} e depois para o amigo. Pensou um momento.

— Acho que isto é teu! — disse ${nome} com um sorriso, e entregou ${objeto}.

${amigo} ficou tão feliz que deu um abraço enorme a ${nome}.

E os dois amigos foram brincar juntos até o sol se pôr.`,
      moral: 'Ajudar os amigos faz-nos muito mais felizes do que ficar com as coisas para nós.'
    };
  },

  () => {
    const nome = pick([...NOMES_M, ...NOMES_F]);
    const animal = pick(ANIMAIS_SIMPLES);
    const local = pick(['floresta','jardim','prado','quinta']);
    const amigo = pick(['uma tartaruga velha e sábia','um pássaro azul','uma raposa gentil','um rato esperto']);
    return {
      titulo: `${nome} Estava Perdido`,
      texto: `${nome} era um ${animal} muito curioso que adorava explorar.

Um dia, foi tão longe que ficou perdido no ${local}.

— Ui! Onde estou? — exclamou ${nome}, assustado.

Começou a ficar com medo. O coração batia muito depressa.

Mas então apareceu ${amigo}.

— Pareces perdido! Posso ajudar-te — disse o amigo com voz calma.

— S-sim, por favor — respondeu ${nome}, muito aliviado.

Juntos, foram pelo caminho certo. O amigo conhecia todos os trilhos.

Em pouco tempo, ${nome} chegou a casa!

A mãe abraçou-o muito forte.

— Pedi ajuda e consegui! — disse ${nome}, orgulhoso.`,
      moral: 'Pedir ajuda quando precisamos é uma coisa muito corajosa e inteligente.'
    };
  },

  () => {
    const nome = pick([...NOMES_M, ...NOMES_F]);
    const animal = pick(ANIMAIS_SIMPLES);
    const medo = pick(['do trovão','do escuro','da chuva forte','do vento']);
    const pessoa = pick(['a avó','a mamã','o papá','a irmã mais velha']);
    return {
      titulo: `${nome} e o Grande Medo`,
      texto: `${nome} era um ${animal} muito meigo.

Mas ${nome} tinha um segredo: tinha muito medo ${medo}.

Uma noite, o medo chegou mesmo aí.

${nome} começou a tremer. Puxou o cobertor até ao nariz.

Então ${pessoa} entrou no quarto.

— Estás bem? — perguntou com voz suave.

— Tenho muito medo ${medo} — disse ${nome} baixinho.

${pessoa} sentou-se ao lado dele e pegou na sua pãozinha.

— Eu estou aqui. E sabes? Os medos ficam mais pequenos quando não estamos sozinhos.

${nome} encostou-se a ${pessoa} e respirou fundo.

Aos poucos, o coração acalmou.

— Já passou — murmurou ${nome}.

— Sempre passa — respondeu ${pessoa} com um sorriso.

E ${nome} adormeceu, muito, muito seguro.`,
      moral: 'Falar dos nossos medos faz com que eles pareçam muito menores.'
    };
  },

  () => {
    const nomeA = pick(NOMES_M);
    const nomeB = pick(NOMES_F);
    const animalA = pick(['coelhinho','ursinho','raposo']);
    const animalB = pick(['tartaruga','ouriço','pato']);
    const local = pick(['lagoa','prado','jardim encantado']);
    return {
      titulo: `${nomeA} e ${nomeB} São Diferentes`,
      texto: `${nomeA} era um ${animalA} que corria muito depressa.

${nomeB} era uma ${animalB} que andava muito devagar.

Um dia, encontraram-se junto à ${local}.

— Queres brincar comigo? — perguntou ${nomeA}.

— Mas... eu sou muito lenta — disse ${nomeB} com vergonha.

— E daí? — respondeu ${nomeA}, encolhendo os ombros. — Eu ensino-te a correr e tu ensinas-me a ir devagar e ver as coisas bonitas!

${nomeB} sorriu.

Brincaram o dia todo.

${nomeA} aprendeu a parar e a olhar para as flores.

${nomeB} aprendeu a dar passadas um pouco maiores.

E quando chegou a hora de ir para casa, os dois eram os melhores amigos.

— Que bom que somos diferentes! — disse ${nomeA}.

— Porque assim aprendemos um com o outro — respondeu ${nomeB}.`,
      moral: 'Ser diferente é uma coisa maravilhosa. Os amigos diferentes ensinam-nos coisas novas.'
    };
  },

  () => {
    const nome = pick([...NOMES_M, ...NOMES_F]);
    const animal = pick(ANIMAIS_SIMPLES);
    const amigo = pick(['um grilo cantor','uma borboleta','um pisco-de-peito-vermelho','uma rã']);
    const dom = pick(['canção muito bonita','dança engraçada','história de embalar','abraço muito quentinho']);
    return {
      titulo: `O Presente de ${nome}`,
      texto: `Era o aniversário do melhor amigo de ${nome}, ${amigo}.

— Quero dar-lhe um presente muito especial — disse ${nome} para si mesmo.

Mas ${nome} não tinha dinheiro nenhum.

Ficou triste. Pensou e pensou.

De repente, teve uma ideia!

No dia do aniversário, ${nome} chegou junto ao amigo.

— Não tenho nada para te dar... a não ser uma ${dom}.

E ${nome} começou.

O amigo ficou de boca aberta, com os olhos cheios de brilho.

Quando acabou, ${amigo} abraçou ${nome} muito forte.

— Foi o melhor presente que alguma vez recebi! — disse ${amigo}.

${nome} percebeu: os presentes do coração são os mais preciosos de todos.`,
      moral: 'Os melhores presentes não se compram — vêm do coração.'
    };

  () => {

    const talento = pick([

Não foi uma revelação dramática. Não foi um ponto de viragem cinematográfico.

      moral: 'Às vezes precisamos que alguém de fora nos mostre o que carregamos dentro — e depois, de termos a coragem de acreditar.'

];

const GERADORES = { 3: g3, 5: g5, 8: g8, 11: g11 };
const LABELS = { 3: '3 anos', 5: '5 anos', 8: '8 anos', 11: '11 anos' };

// ─── UI STATE ───

function selectAge(idade) {
  idadeAtual = idade;
  document.querySelectorAll('.age-tab').forEach(t => {
    t.classList.toggle('active', parseInt(t.dataset.age) === idade);
  });
}

function gerarHistoria() {
  const lista = GERADORES[idadeAtual];
  const gerador = pick(lista);
  historiaAtual = { ...gerador(), idade: idadeAtual, data: new Date().toISOString() };

  document.getElementById('historia-titulo').textContent = historiaAtual.titulo;
  document.getElementById('historia-texto').textContent = historiaAtual.texto;

  const moralEl = document.getElementById('historia-moral');
  if (historiaAtual.moral) {
    moralEl.textContent = '✦ ' + historiaAtual.moral;
    moralEl.style.display = 'block';
  } else {
    moralEl.style.display = 'none';
  }

  document.getElementById('badge-idade').textContent = LABELS[idadeAtual];

  const card = document.getElementById('historia-card');
  card.style.display = 'block';
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ─── SAVE / LIBRARY ───

function carregarBiblioteca() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function guardarBiblioteca(lista) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
}

function guardarHistoria() {
  if (!historiaAtual) return;
  const lista = carregarBiblioteca();
  const entrada = { ...historiaAtual, id: Date.now() };
  lista.unshift(entrada);
  guardarBiblioteca(lista);
  renderBiblioteca();
  mostrarToast('📚 História guardada na biblioteca!');
}

function apagarHistoria(id) {
  if (!confirm('Apagar esta história?')) return;
  const lista = carregarBiblioteca().filter(h => h.id !== id);
  guardarBiblioteca(lista);
  renderBiblioteca();
  mostrarToast('🗑️ História apagada.');
}

function renderBiblioteca() {
  const lista = carregarBiblioteca();
  const grid = document.getElementById('biblioteca-grid');
  const vazia = document.getElementById('biblioteca-vazia');
  const count = document.getElementById('biblioteca-count');

  count.textContent = lista.length + (lista.length === 1 ? ' história' : ' histórias');

  if (lista.length === 0) {
    vazia.style.display = 'block';
    grid.innerHTML = '';
    return;
  }

  vazia.style.display = 'none';
  grid.innerHTML = lista.map(h => {
    const d = new Date(h.data);
    const data = d.toLocaleDateString('pt-PT', { day:'2-digit', month:'short', year:'numeric' });
    return `<div class="story-book-card">
      <div class="card-titulo">${esc(h.titulo)}</div>
      <div class="card-meta">
        <span class="card-badge">${LABELS[h.idade]}</span>
        <span class="card-date">${data}</span>
      </div>
      <div class="card-actions">
        <button class="card-btn" onclick="lerHistoria(${h.id})">📖 Ler</button>
        <button class="card-btn" onclick="downloadHistoriaSalva(${h.id})">📥</button>
        <button class="card-btn del" onclick="apagarHistoria(${h.id})">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function lerHistoria(id) {
  const lista = carregarBiblioteca();
  const h = lista.find(x => x.id === id);
  if (!h) return;
  modalHistoria = h;

  const d = new Date(h.data);
  const data = d.toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' });

  document.getElementById('modal-meta').innerHTML =
    `<span class="badge-idade">${LABELS[h.idade]}</span> <span class="badge-tema">${data}</span>`;
  document.getElementById('modal-titulo').textContent = h.titulo;
  document.getElementById('modal-texto').textContent = h.texto;

  const moralEl = document.getElementById('modal-moral');
  if (h.moral) {
    moralEl.textContent = '✦ ' + h.moral;
    moralEl.style.display = 'block';
  } else {
    moralEl.style.display = 'none';
  }

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fecharModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  modalHistoria = null;
}

// ─── DOWNLOAD ───

function buildTxt(h) {
  const linhas = [
    `HISTÓRIA PARA ${LABELS[h.idade].toUpperCase()}`,
    '═'.repeat(50),
    '',
    h.titulo,
    '',
    '─'.repeat(50),
    '',
    h.texto,
    '',
  ];
  if (h.moral) {
    linhas.push('─'.repeat(50));
    linhas.push('');
    linhas.push('Moral: ' + h.moral);
    linhas.push('');
  }
  const d = new Date(h.data);
  linhas.push('─'.repeat(50));
  linhas.push(`Gerada em: ${d.toLocaleDateString('pt-PT')} às ${d.toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit'})}`);
  return linhas.join('\n');
}

function downloadTxt(h) {
  const blob = new Blob([buildTxt(h)], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = h.titulo.replace(/[^a-zA-ZÀ-ÿ0-9\s]/g, '').trim().replace(/\s+/g, '_') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
}

function downloadHistoria() {
  if (historiaAtual) downloadTxt(historiaAtual);
}

function downloadModalHistoria() {
  if (modalHistoria) downloadTxt(modalHistoria);
}

function downloadHistoriaSalva(id) {
  const h = carregarBiblioteca().find(x => x.id === id);
  if (h) downloadTxt(h);
}

// ─── TOAST ───

let toastTimer;
function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ─── ESCAPE HELPER ───
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── MODAL CLOSE ON BACKDROP ───
document.getElementById('modal').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});

// ─── INIT ───
renderBiblioteca();
</script>

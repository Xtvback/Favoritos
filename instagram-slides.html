<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Slides Instagram — Gerador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --app:   #06060f;
      --panel: #0b0b18;
      --card:  #11111e;
      --c2:    #17172a;
      --bd:    rgba(255,255,255,.065);
      --acc:   #7c3aed;
      --acc2:  #ec4899;
      --tx:    #eeeef8;
      --mu:    #50506a;
      --gr:    #10b981;
      --rd:    #ef4444;
      --r:     12px;
      --rs:    8px;
    }
    body { font-family:'Inter',system-ui,sans-serif; background:var(--app); color:var(--tx); min-height:100dvh; overflow-x:hidden; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:99px; }

    /* ── HEADER ── */
    .hdr {
      position:sticky; top:0; z-index:300;
      display:flex; align-items:center; gap:14px;
      padding:14px 28px;
      background:rgba(6,6,15,.9);
      backdrop-filter:blur(20px) saturate(1.3);
      border-bottom:1px solid var(--bd);
    }
    .hdr-logo {
      width:36px; height:36px; flex-shrink:0;
      background:linear-gradient(135deg,var(--acc),var(--acc2));
      border-radius:10px; display:grid; place-items:center;
      font-size:17px; box-shadow:0 4px 14px rgba(124,58,237,.38);
    }
    .hdr h1   { font-size:15px; font-weight:700; }
    .hdr small { font-size:11px; color:var(--mu); display:block; margin-top:2px; }

    /* ── LAYOUT ── */
    .wrap { display:grid; grid-template-columns:400px 1fr; min-height:calc(100dvh - 65px); }
    @media(max-width:900px){ .wrap{grid-template-columns:1fr;} }

    /* ── FORM ── */
    .form {
      background:var(--panel); border-right:1px solid var(--bd);
      overflow-y:auto; max-height:calc(100dvh - 65px);
      display:flex; flex-direction:column;
    }
    @media(max-width:900px){ .form{max-height:none;} }

    .fsec { padding:20px 20px 18px; border-bottom:1px solid var(--bd); }
    .fsec:last-child { border-bottom:none; }

    .sec-ttl {
      font-size:10px; font-weight:700; letter-spacing:1px;
      text-transform:uppercase; color:var(--mu);
      margin-bottom:14px; display:flex; align-items:center; gap:8px;
    }
    .sec-ttl::after { content:''; flex:1; height:1px; background:var(--bd); }

    /* ── INPUTS ── */
    .fld { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
    .fld:last-child { margin-bottom:0; }
    .fld > label { font-size:11px; font-weight:500; color:#777; }
    .opt-lbl { font-size:11px; color:var(--mu); }

    input[type=text], textarea {
      background:var(--card); border:1px solid var(--bd); border-radius:var(--rs);
      padding:10px 12px; color:var(--tx); font-family:inherit; font-size:14px;
      outline:none; width:100%; transition:border-color .18s, box-shadow .18s;
    }
    input[type=text]:focus, textarea:focus {
      border-color:rgba(124,58,237,.5);
      box-shadow:0 0 0 3px rgba(124,58,237,.1);
    }
    textarea { resize:vertical; line-height:1.6; }

    /* ── UPLOAD ── */
    .upbox {
      position:relative; border:1.5px dashed rgba(255,255,255,.1);
      border-radius:var(--r); min-height:96px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:6px; cursor:pointer; overflow:hidden;
      background:var(--card); transition:border-color .2s, background .2s;
    }
    .upbox:hover, .upbox.drag { border-color:var(--acc); background:rgba(124,58,237,.06); }
    .upbox input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .up-ico { font-size:24px; pointer-events:none; }
    .up-txt { font-size:12px; color:var(--mu); pointer-events:none; }
    #imgPrev { max-width:100%; max-height:140px; border-radius:8px; object-fit:cover; display:none; }

    /* ── SLIDE INPUTS ── */
    .slide-list { display:flex; flex-direction:column; gap:10px; }

    .sinp { background:var(--card); border:1px solid var(--bd); border-radius:var(--r); overflow:hidden; transition:border-color .18s; }
    .sinp:focus-within { border-color:rgba(124,58,237,.35); }

    .sinp-hdr {
      display:flex; align-items:center; gap:8px;
      padding:9px 12px; background:rgba(255,255,255,.025); border-bottom:1px solid var(--bd);
    }
    .sinp-dot { width:7px; height:7px; border-radius:50%; background:var(--acc); flex-shrink:0; }
    .sinp-lbl { font-size:11px; font-weight:700; color:var(--acc); flex:1; }
    .sinp-rm {
      background:none; border:none; color:var(--mu); cursor:pointer;
      font-size:12px; width:22px; height:22px; border-radius:4px;
      display:grid; place-items:center; transition:color .15s, background .15s;
    }
    .sinp-rm:hover { color:var(--rd); background:rgba(239,68,68,.1); }
    .sinp textarea {
      border:none; border-radius:0; background:transparent;
      min-height:90px; padding:10px 12px; font-size:13px; resize:vertical;
    }
    .sinp textarea:focus { box-shadow:none; }

    .add-slide {
      width:100%; padding:10px 14px; margin-top:10px;
      background:rgba(124,58,237,.055); border:1.5px dashed rgba(124,58,237,.22);
      border-radius:var(--r); color:var(--acc); font-family:inherit;
      font-size:13px; font-weight:600; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
      transition:background .15s, border-color .15s;
    }
    .add-slide:hover { background:rgba(124,58,237,.12); border-color:rgba(124,58,237,.45); }
    .add-slide:disabled { opacity:.32; cursor:default; }

    /* ── HASHTAGS ── */
    .hash-row { display:flex; gap:8px; }
    .hash-row textarea { min-height:72px; font-size:13px; }
    .copy-btn {
      flex-shrink:0; padding:9px 12px; background:var(--c2);
      border:1px solid var(--bd); border-radius:var(--rs);
      color:var(--tx); font-family:inherit; font-size:12px; font-weight:600;
      cursor:pointer; white-space:nowrap; transition:background .15s;
    }
    .copy-btn:hover { background:rgba(255,255,255,.08); }
    .toggle-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .toggle-row label { font-size:12px; color:var(--mu); cursor:pointer; }
    input[type=checkbox] { accent-color:var(--acc); cursor:pointer; width:14px; height:14px; }

    /* ── FONT / THEME ── */
    .font-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .fopt { background:var(--card); border:1.5px solid var(--bd); border-radius:var(--rs); padding:10px 12px; cursor:pointer; text-align:left; transition:border-color .18s, background .18s; }
    .fopt.on { border-color:var(--acc); background:rgba(124,58,237,.08); }
    .fo-n { font-size:13px; font-weight:600; display:block; margin-bottom:2px; }
    .fo-s { font-size:11px; color:var(--mu); }

    .tgrid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .tbtn {
      border:2px solid transparent; border-radius:var(--r);
      padding:12px 6px 9px; cursor:pointer; font-family:inherit;
      font-size:12px; font-weight:600; text-align:center; line-height:1.3;
      transition:transform .15s, border-color .15s, box-shadow .15s;
    }
    .tbtn em { display:block; font-style:normal; font-size:18px; margin-bottom:4px; }
    .tbtn.on { border-color:rgba(255,255,255,.72); transform:scale(1.06); box-shadow:0 6px 18px rgba(0,0,0,.4); }

    /* ── GENERATE ── */
    .gen-wrap { padding:18px 20px; }
    .gen {
      width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
      padding:15px 20px; background:linear-gradient(135deg,var(--acc),var(--acc2));
      color:#fff; font-family:inherit; font-size:15px; font-weight:700;
      border:none; border-radius:var(--r); cursor:pointer;
      position:relative; overflow:hidden; transition:transform .15s, box-shadow .2s;
    }
    .gen::after { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,255,255,.16) 0%,transparent 55%); pointer-events:none; }
    .gen:hover { transform:translateY(-2px); box-shadow:0 12px 34px rgba(124,58,237,.48); }
    .gen:active { transform:translateY(0); }

    /* ── PREVIEW ── */
    .prev { padding:22px 20px; overflow-y:auto; }
    .prev-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .prev-hdr h2 { font-size:15px; font-weight:700; }

    .dl-all {
      display:none; align-items:center; gap:7px; padding:8px 16px;
      background:rgba(16,185,129,.1); color:var(--gr);
      border:1px solid rgba(16,185,129,.2); border-radius:var(--rs);
      font-family:inherit; font-size:13px; font-weight:600;
      cursor:pointer; transition:background .15s;
    }
    .dl-all:hover { background:rgba(16,185,129,.2); }

    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:400px; text-align:center; color:var(--mu); }
    .empty-ico { font-size:44px; opacity:.18; }
    .empty strong { color:#888; font-size:14px; }
    .empty p { font-size:12px; line-height:1.6; }

    .loading { display:none; align-items:center; justify-content:center; gap:12px; height:180px; color:var(--mu); font-size:13px; }
    .spin { width:20px; height:20px; border:2px solid rgba(255,255,255,.07); border-top-color:var(--acc); border-radius:50%; animation:spin .65s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg);} }

    /* ── SLIDE GRID ── */
    .sgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:12px; }
    .scard { position:relative; border-radius:var(--r); overflow:hidden; border:1px solid var(--bd); background:#000; cursor:pointer; aspect-ratio:1/1; transition:transform .2s,box-shadow .2s; }
    .scard:hover { transform:translateY(-5px); box-shadow:0 16px 40px rgba(0,0,0,.6); }
    .scard canvas { width:100%; height:100%; display:block; }
    .scard-ft { position:absolute; bottom:0; left:0; right:0; padding:7px 10px; background:rgba(0,0,0,.75); backdrop-filter:blur(8px); font-size:12px; font-weight:600; display:flex; align-items:center; justify-content:space-between; }
    .scard-badge { background:rgba(255,255,255,.09); border-radius:4px; padding:2px 7px; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:rgba(255,255,255,.5); }
    .dl1 { background:none; border:none; color:#fff; font-size:13px; cursor:pointer; opacity:.55; padding:3px 4px; transition:opacity .15s; }
    .dl1:hover { opacity:1; }

    /* ── MODAL ── */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:500; align-items:center; justify-content:center; padding:20px; }
    .modal.open { display:flex; }
    .mbox { position:relative; width:min(520px,100%); }
    .mbox canvas { width:100%; height:auto; border-radius:var(--r); display:block; }
    .mclose { position:absolute; top:-42px; right:0; background:rgba(255,255,255,.1); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:13px; cursor:pointer; display:grid; place-items:center; transition:background .15s; }
    .mclose:hover { background:rgba(255,255,255,.2); }
    .mnav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
    .mbtn { background:rgba(255,255,255,.08); border:none; color:#fff; padding:8px 14px; border-radius:var(--rs); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; transition:background .15s; }
    .mbtn:hover { background:rgba(255,255,255,.16); }
    .mbtn:disabled { opacity:.25; cursor:default; }
    .mbtn.g { background:rgba(16,185,129,.12); color:var(--gr); border:1px solid rgba(16,185,129,.2); }
    .mbtn.g:hover { background:rgba(16,185,129,.22); }
    .mctr { font-size:12px; color:var(--mu); }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px); background:rgba(16,185,129,.12); color:var(--gr); border:1px solid rgba(16,185,129,.25); border-radius:var(--rs); padding:9px 18px; font-size:13px; font-weight:600; backdrop-filter:blur(12px); opacity:0; pointer-events:none; transition:opacity .22s,transform .22s; z-index:999; white-space:nowrap; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">📸</div>
  <div>
    <h1>Slides Instagram</h1>
    <small>Gerador de carrossel 1080 × 1080</small>
  </div>
</header>

<div class="wrap">

  <!-- ══ FORMULÁRIO ══ -->
  <section class="form">

    <!-- CAPA -->
    <div class="fsec">
      <div class="sec-ttl">Slide de Capa</div>
      <div class="fld">
        <label>Imagem de fundo</label>
        <div class="upbox" id="upbox">
          <input type="file" accept="image/*" id="fileIn">
          <div id="upPH"><div class="up-ico">🖼️</div><div class="up-txt">Clica ou arrasta aqui</div></div>
          <img id="imgPrev" alt="">
        </div>
      </div>
      <div class="fld">
        <label>Título principal</label>
        <input type="text" id="titleIn" placeholder="Ex: 5 Dicas Para Crescer no Instagram">
      </div>
      <div class="fld">
        <label>Subtítulo <span class="opt-lbl">(opcional)</span></label>
        <input type="text" id="subIn" placeholder="Uma frase de contextualização">
      </div>
    </div>

    <!-- SLIDES DE CONTEÚDO -->
    <div class="fsec">
      <div class="sec-ttl">Slides de Conteúdo</div>
      <div class="slide-list" id="slideList"></div>
      <button class="add-slide" id="addBtn"><span>＋</span><span id="addLbl">Adicionar Slide</span></button>
    </div>

    <!-- SLIDE FINAL -->
    <div class="fsec">
      <div class="sec-ttl">Slide Final</div>
      <div class="fld">
        <label>@Username</label>
        <input type="text" id="handleIn" placeholder="@teuinstagram">
      </div>
      <div class="fld">
        <label>Call-to-action <span class="opt-lbl">(deixa vazio para design padrão)</span></label>
        <textarea id="ctaIn" rows="3" placeholder="Ex: Guarda este post!&#10;Segue @handle para mais conteúdo ✦"></textarea>
      </div>
    </div>

    <!-- HASHTAGS -->
    <div class="fsec">
      <div class="sec-ttl">Hashtags</div>
      <div class="hash-row">
        <textarea id="hashIn" rows="3" placeholder="#instagram #marketing #dicas&#10;#portugal #conteudo"></textarea>
        <button class="copy-btn" id="copyHashBtn">📋 Copiar</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="hashOnSlide">
        <label for="hashOnSlide">Mostrar hashtags no último slide</label>
      </div>
    </div>

    <!-- ESTILO -->
    <div class="fsec">
      <div class="sec-ttl">Estilo</div>
      <div class="fld">
        <label>Tipografia</label>
        <div class="font-row" id="fontRow"></div>
      </div>
      <div class="fld" style="margin-top:12px">
        <label>Tema de cor</label>
        <div class="tgrid" id="themeGrid"></div>
      </div>
    </div>

    <div class="gen-wrap">
      <button class="gen" id="genBtn">✨ &nbsp;Gerar Slides</button>
    </div>

  </section>

  <!-- ══ PREVIEW ══ -->
  <section class="prev">
    <div class="prev-hdr">
      <h2>Preview</h2>
      <button class="dl-all" id="dlAllBtn">⬇ Download Todos</button>
    </div>
    <div class="empty" id="emptyEl">
      <div class="empty-ico">📲</div>
      <div>
        <strong>Os slides aparecem aqui</strong>
        <p>Preenche o formulário à esquerda<br>e clica em Gerar Slides</p>
      </div>
    </div>
    <div class="loading" id="loadEl"><div class="spin"></div><span>A gerar…</span></div>
    <div class="sgrid" id="sgrid"></div>
  </section>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="mbox">
    <button class="mclose" id="mClose">✕</button>
    <canvas id="mCv"></canvas>
    <div class="mnav">
      <button class="mbtn" id="mPrev">← Anterior</button>
      <span class="mctr" id="mCtr">1 / 6</span>
      <button class="mbtn g" id="mDl">⬇ Download</button>
      <button class="mbtn" id="mNext">Próximo →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ═══════════════════════════════════════
//  CANVAS CONSTANTS
// ═══════════════════════════════════════
const S = 1080, P = 72;

// ═══════════════════════════════════════
//  THEMES
// ═══════════════════════════════════════
const THEMES = {
  noir:     { n:'Noir',     i:'🖤', g1:'#080808', g2:'#111111', ac:'#c9a84c', tx:'#f4f0e8', su:'#787870', ov:'rgba(0,0,0,.64)',      nb:'rgba(201,168,76,.05)'  },
  slate:    { n:'Slate',    i:'🌊', g1:'#060e1c', g2:'#0c1726', ac:'#38bdf8', tx:'#e0eef8', su:'#5e88aa', ov:'rgba(6,14,28,.64)',     nb:'rgba(56,189,248,.046)' },
  ivory:    { n:'Ivory',    i:'🤍', g1:'#faf9f4', g2:'#ede8e0', ac:'#18181a', tx:'#18181a', su:'#686260', ov:'rgba(248,246,240,.52)', nb:'rgba(24,24,26,.034)'   },
  forest:   { n:'Forest',   i:'🌿', g1:'#06140c', g2:'#0a1e12', ac:'#4ade80', tx:'#edfaf3', su:'#78b48a', ov:'rgba(6,20,12,.65)',     nb:'rgba(74,222,128,.046)' },
  rose:     { n:'Rose',     i:'🌹', g1:'#160610', g2:'#200e18', ac:'#fb7185', tx:'#fff0f2', su:'#be7e8c', ov:'rgba(22,6,16,.65)',     nb:'rgba(251,113,133,.05)' },
  midnight: { n:'Midnight', i:'🌙', g1:'#070517', g2:'#0d0b24', ac:'#a78bfa', tx:'#ede8ff', su:'#7868b4', ov:'rgba(7,5,23,.65)',      nb:'rgba(167,139,250,.05)' }
};

const FONTS = {
  editorial: { n:'Editorial', d:'Playfair + Inter',   tt:"'Playfair Display',Georgia,serif", tb:"'Inter',system-ui,sans-serif",   tw:'900', bw:'400' },
  modern:    { n:'Moderno',   d:'Montserrat + Inter', tt:"'Montserrat','Inter',sans-serif",  tb:"'Inter',system-ui,sans-serif",   tw:'800', bw:'300' }
};

// ═══════════════════════════════════════
//  APP STATE
// ═══════════════════════════════════════
let TK = 'noir', FK = 'editorial';
let coverImg = null, genSlides = [], mIdx = 0;
let nextId = 1;
let cSlides = [
  { id: nextId++, text: '' },
  { id: nextId++, text: '' },
  { id: nextId++, text: '' },
  { id: nextId++, text: '' }
];

// ═══════════════════════════════════════
//  INIT — THEMES & FONTS
// ═══════════════════════════════════════
(function() {
  const tg = document.getElementById('themeGrid');
  for (const [k, t] of Object.entries(THEMES)) {
    const b = document.createElement('button');
    b.className = 'tbtn' + (k === TK ? ' on' : '');
    b.style.cssText = `background:linear-gradient(150deg,${t.g1},${t.g2});color:${t.tx}`;
    b.innerHTML = `<em>${t.i}</em>${t.n}`;
    b.onclick = () => { document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('on')); b.classList.add('on'); TK = k; };
    tg.appendChild(b);
  }

  const fr = document.getElementById('fontRow');
  for (const [k, f] of Object.entries(FONTS)) {
    const b = document.createElement('button');
    b.className = 'fopt' + (k === FK ? ' on' : '');
    b.innerHTML = `<span class="fo-n">${f.n}</span><span class="fo-s">${f.d}</span>`;
    b.onclick = () => { document.querySelectorAll('.fopt').forEach(x => x.classList.remove('on')); b.classList.add('on'); FK = k; };
    fr.appendChild(b);
  }
})();

// ═══════════════════════════════════════
//  INIT — UPLOAD
// ═══════════════════════════════════════
(function() {
  const box = document.getElementById('upbox');
  const inp = document.getElementById('fileIn');
  const prv = document.getElementById('imgPrev');
  const ph  = document.getElementById('upPH');

  function load(f) {
    if (!f?.type.startsWith('image/')) return;
    const r = new FileReader();
    r.onload = e => {
      const img = new Image();
      img.onload = () => { coverImg = img; prv.src = e.target.result; prv.style.display = 'block'; ph.style.display = 'none'; };
      img.src = e.target.result;
    };
    r.readAsDataURL(f);
  }

  inp.addEventListener('change', e => load(e.target.files[0]));
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });
  box.addEventListener('dragleave', () => box.classList.remove('drag'));
  box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('drag'); load(e.dataTransfer.files[0]); });
})();

// ═══════════════════════════════════════
//  DYNAMIC SLIDE INPUTS
// ═══════════════════════════════════════
function renderSlides() {
  const total = cSlides.length + 2;
  const list  = document.getElementById('slideList');
  list.innerHTML = '';

  cSlides.forEach((slide, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'sinp';

    const hdr = document.createElement('div');
    hdr.className = 'sinp-hdr';

    const dot = document.createElement('span'); dot.className = 'sinp-dot';
    const lbl = document.createElement('span'); lbl.className = 'sinp-lbl';
    lbl.textContent = `Slide ${i + 2}  ·  ${total} no total`;
    hdr.append(dot, lbl);

    if (cSlides.length > 1) {
      const rm = document.createElement('button');
      rm.className = 'sinp-rm'; rm.title = 'Remover'; rm.textContent = '✕';
      rm.onclick = () => { cSlides.splice(i, 1); renderSlides(); };
      hdr.appendChild(rm);
    }

    const ta = document.createElement('textarea');
    ta.placeholder = `Texto do slide ${i + 2}…`;
    ta.value = slide.text;
    ta.oninput = function() { slide.text = this.value; };

    wrap.append(hdr, ta);
    list.appendChild(wrap);
  });

  const btn = document.getElementById('addBtn');
  const lbl = document.getElementById('addLbl');
  btn.disabled = cSlides.length >= 8;
  lbl.textContent = `Adicionar Slide  (${cSlides.length} / 8)`;
}

document.getElementById('addBtn').onclick = () => {
  if (cSlides.length >= 8) return;
  cSlides.push({ id: nextId++, text: '' });
  renderSlides();
};

renderSlides();

// ═══════════════════════════════════════
//  CANVAS HELPERS
// ═══════════════════════════════════════
const mkC = () => { const c = document.createElement('canvas'); c.width = S; c.height = S; return c; };
const p2  = n => String(n).padStart(2, '0');

function gradBg(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, S * .22, S);
  g.addColorStop(0, t.g1); g.addColorStop(1, t.g2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}

function coverFit(ctx, img) {
  const ia = img.width / img.height;
  let sw, sh, sx, sy;
  if (ia >= 1) { sh = S; sw = S * ia; sx = -(sw - S) / 2; sy = 0; }
  else          { sw = S; sh = S / ia; sx = 0; sy = -(sh - S) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh);
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function autoFS(ctx, text, maxW, maxH, hi, lo, wt, fam) {
  let fs = hi;
  while (fs > lo) {
    ctx.font = `${wt} ${fs}px ${fam}`;
    let h = 0;
    for (const para of text.split('\n')) {
      if (!para.trim()) { h += fs * .5; continue; }
      h += wrapText(ctx, para, maxW).length * fs * 1.56;
    }
    if (h <= maxH) break;
    fs -= 2;
  }
  return Math.max(fs, lo);
}

function drawCentered(ctx, text, cx, cy, maxW, lh) {
  const rows = [];
  for (const para of text.split('\n')) {
    if (!para.trim()) { rows.push(null); continue; }
    for (const l of wrapText(ctx, para, maxW)) rows.push(l);
  }
  while (rows.length && rows[0] === null) rows.shift();
  while (rows.length && rows[rows.length - 1] === null) rows.pop();
  if (!rows.length) return;

  const totalH = rows.reduce((a, r) => a + (r === null ? lh * .45 : lh), 0);
  let y = cy - totalH / 2;
  for (const row of rows) {
    if (row === null) { y += lh * .45; continue; }
    ctx.fillText(row, cx, y + lh * .74); y += lh;
  }
}

function drawDots(ctx, active, total, t) {
  const r = 7, gap = 14;
  const tw = total * (r * 2) + (total - 1) * gap;
  const sx = (S - tw) / 2, y = S - 54;
  for (let i = 0; i < total; i++) {
    const x = sx + i * (r * 2 + gap) + r, cur = i === active - 1;
    ctx.beginPath();
    ctx.arc(x, y, cur ? r : r * .5, 0, Math.PI * 2);
    ctx.fillStyle = cur ? t.ac : t.tx + '22';
    ctx.fill();
  }
}

function drawTopBar(ctx, handle, num, total, fp, t, onImg) {
  if (handle) {
    const h = handle.startsWith('@') ? handle : '@' + handle;
    ctx.save();
    ctx.font = `500 28px ${fp.tb}`;
    ctx.fillStyle = onImg ? 'rgba(255,255,255,.82)' : t.su + 'bb';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(h, P, P + 2);
    ctx.restore();
  }
  ctx.save();
  ctx.font = `600 25px ${fp.tb}`;
  ctx.fillStyle = onImg ? 'rgba(255,255,255,.72)' : t.ac;
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText(p2(num) + ' / ' + p2(total), S - P, P + 2);
  ctx.restore();
}

// ═══════════════════════════════════════
//  SLIDE 1 — CAPA
// ═══════════════════════════════════════
function makeCover(title, sub, handle, total, fp, t) {
  const c = mkC(), ctx = c.getContext('2d');

  if (coverImg) {
    coverFit(ctx, coverImg);
    // Vignette
    const vig = ctx.createRadialGradient(S/2, S/2, S*.16, S/2, S/2, S*.88);
    vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,.44)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, S, S);
    // Bottom gradient
    const bot = ctx.createLinearGradient(0, S * .28, 0, S);
    bot.addColorStop(0, 'rgba(0,0,0,0)'); bot.addColorStop(.35, t.ov); bot.addColorStop(1, 'rgba(0,0,0,.92)');
    ctx.fillStyle = bot; ctx.fillRect(0, 0, S, S);
    // Top gradient
    const top = ctx.createLinearGradient(0, 0, 0, S * .2);
    top.addColorStop(0, 'rgba(0,0,0,.46)'); top.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = top; ctx.fillRect(0, 0, S, S * .2);
  } else {
    gradBg(ctx, t);
    ctx.save(); ctx.globalAlpha = .06;
    ctx.beginPath(); ctx.arc(S * .86, S * .13, 390, 0, Math.PI * 2); ctx.fillStyle = t.ac; ctx.fill();
    ctx.beginPath(); ctx.arc(S * .08, S * .82, 260, 0, Math.PI * 2); ctx.fillStyle = t.ac; ctx.fill();
    ctx.restore();
  }

  drawTopBar(ctx, handle, 1, total, fp, t, true);

  // Build bottom content upward
  let y = S - P;

  // Swipe hint
  ctx.save(); ctx.font = `300 20px ${fp.tb}`;
  ctx.fillStyle = 'rgba(255,255,255,.38)';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('desliza para ler  →', S - P, y);
  ctx.restore(); y -= 44;

  // Subtitle
  if (sub) {
    ctx.save(); ctx.font = `300 30px ${fp.tb}`;
    ctx.fillStyle = 'rgba(255,255,255,.65)';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 10;
    const sl = wrapText(ctx, sub, S - P * 2);
    y -= (sl.length - 1) * 38;
    sl.forEach((l, i) => ctx.fillText(l, P, y + i * 38));
    y -= 38 + 14; ctx.restore();
  }

  // Title
  ctx.save(); ctx.font = `${fp.tw} 76px ${fp.tt}`;
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.shadowColor = 'rgba(0,0,0,.65)'; ctx.shadowBlur = 22;
  const tl = wrapText(ctx, title || 'Título', S - P * 2);
  y -= (tl.length - 1) * 88;
  tl.forEach((l, i) => ctx.fillText(l, P, y + i * 88));
  y -= 88 + 20; ctx.restore();

  // Accent bar above title
  ctx.save(); ctx.fillStyle = t.ac; ctx.fillRect(P, y - 2, 100, 5); ctx.restore();

  drawDots(ctx, 1, total, t);
  return c;
}

// ═══════════════════════════════════════
//  SLIDES DE CONTEÚDO
// ═══════════════════════════════════════
function makeContent(text, num, title, handle, total, fp, t) {
  const c = mkC(), ctx = c.getContext('2d');
  gradBg(ctx, t);

  // Faded bg slide number
  ctx.save();
  ctx.font = `700 290px ${fp.tb}`;
  ctx.fillStyle = t.nb;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(p2(num), S - P + 22, S * .52);
  ctx.restore();

  // Left accent bar
  ctx.save(); ctx.fillStyle = t.ac; ctx.fillRect(P, P + 60, 4, 110); ctx.restore();

  drawTopBar(ctx, handle, num, total, fp, t, false);

  // Auto-size text to fit
  const maxW = S - P * 2.5, contentH = 640;
  const fs = text ? autoFS(ctx, text, maxW, contentH, 52, 26, fp.bw, fp.tb) : 48;
  const lh = fs * 1.56;

  ctx.save();
  ctx.font = `${fp.bw} ${fs}px ${fp.tb}`;
  ctx.fillStyle = t.tx;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  drawCentered(ctx, text || '', S / 2, S * .47, maxW, lh);
  ctx.restore();

  // Small title reference at footer
  if (title) {
    ctx.save();
    ctx.font = `italic 400 22px ${fp.tt}`;
    ctx.fillStyle = t.su; ctx.globalAlpha = .38;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(title, S / 2, S - P - 28);
    ctx.restore();
  }

  drawDots(ctx, num, total, t);
  return c;
}

// ═══════════════════════════════════════
//  SLIDE FINAL
// ═══════════════════════════════════════
function makeLast(cta, handle, hashtags, showHash, total, fp, t) {
  const c = mkC(), ctx = c.getContext('2d');
  gradBg(ctx, t);

  // Decorative concentric rings
  const cx = S / 2, cy = S * .42;
  ctx.save(); ctx.globalAlpha = .09;
  ctx.beginPath(); ctx.arc(cx, cy, 340, 0, Math.PI * 2); ctx.fillStyle = t.ac; ctx.fill();
  ctx.restore();
  [[280, .06, 1.5], [220, .04, 1]].forEach(([r, op, lw]) => {
    ctx.save(); ctx.globalAlpha = op; ctx.strokeStyle = t.ac; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  });

  drawTopBar(ctx, handle, total, total, fp, t, false);

  if (cta) {
    // Custom CTA from user
    const fs = autoFS(ctx, cta, S - P * 2, 480, 62, 28, fp.tw, fp.tt);
    const lh = fs * 1.52;
    ctx.save(); ctx.font = `${fp.tw} ${fs}px ${fp.tt}`;
    ctx.fillStyle = t.tx; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    drawCentered(ctx, cta, S / 2, cy, S - P * 2, lh); ctx.restore();
  } else {
    // Default engagement design
    ctx.save(); ctx.font = `${fp.tw} 54px ${fp.tt}`;
    ctx.fillStyle = t.tx; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Gostaste?', S / 2, cy - 76); ctx.restore();

    const actions = ['♥  Deixa um Like', '►  Partilha com alguém', '◎  Segue para não perder'];
    ctx.save(); ctx.font = `400 33px ${fp.tb}`;
    ctx.fillStyle = t.su; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    actions.forEach((a, i) => ctx.fillText(a, S / 2, cy + 10 + i * 62));
    ctx.restore();
  }

  // Gradient divider
  ctx.save();
  const dg = ctx.createLinearGradient(S/2 - 90, 0, S/2 + 90, 0);
  dg.addColorStop(0, 'transparent'); dg.addColorStop(.5, t.ac); dg.addColorStop(1, 'transparent');
  ctx.strokeStyle = dg; ctx.lineWidth = 1.5; ctx.globalAlpha = .4;
  ctx.beginPath(); ctx.moveTo(S / 2 - 90, S * .67); ctx.lineTo(S / 2 + 90, S * .67); ctx.stroke();
  ctx.restore();

  // Handle prominent
  if (handle) {
    const h = handle.startsWith('@') ? handle : '@' + handle;
    ctx.save(); ctx.font = `600 36px ${fp.tb}`;
    ctx.fillStyle = t.ac; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(h, S / 2, S * .75); ctx.restore();
  }

  // Hashtags on slide
  if (showHash && hashtags.trim()) {
    const hStr = hashtags.replace(/\n/g, ' ').trim();
    ctx.save(); ctx.font = `400 21px ${fp.tb}`;
    ctx.fillStyle = t.su; ctx.globalAlpha = .48;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const hLines = wrapText(ctx, hStr, S - P * 2);
    let hy = S - P - 22;
    for (let i = hLines.length - 1; i >= 0; i--) { ctx.fillText(hLines[i], S / 2, hy); hy -= 28; }
    ctx.restore();
  }

  drawDots(ctx, total, total, t);
  return c;
}

// ═══════════════════════════════════════
//  GENERATE
// ═══════════════════════════════════════
async function generate() {
  const title    = document.getElementById('titleIn').value.trim();
  const sub      = document.getElementById('subIn').value.trim();
  const handle   = document.getElementById('handleIn').value.trim();
  const cta      = document.getElementById('ctaIn').value.trim();
  const hashtags = document.getElementById('hashIn').value.trim();
  const showHash = document.getElementById('hashOnSlide').checked;
  const fp = FONTS[FK], t = THEMES[TK];

  if (!title && cSlides.every(s => !s.text.trim())) {
    alert('Preenche o título ou o conteúdo de pelo menos um slide.'); return;
  }

  document.getElementById('emptyEl').style.display = 'none';
  document.getElementById('loadEl').style.display  = 'flex';
  document.getElementById('sgrid').innerHTML       = '';
  document.getElementById('dlAllBtn').style.display = 'none';
  genSlides = [];

  await document.fonts.load(`${fp.tw} 80px ${fp.tt}`);
  await document.fonts.load(`${fp.bw} 50px ${fp.tb}`);
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 60));

  const total = cSlides.length + 2;

  genSlides.push(makeCover(title, sub, handle, total, fp, t));
  cSlides.forEach((s, i) => genSlides.push(makeContent(s.text, i + 2, title, handle, total, fp, t)));
  genSlides.push(makeLast(cta, handle, hashtags, showHash, total, fp, t));

  document.getElementById('loadEl').style.display = 'none';
  const grid = document.getElementById('sgrid');

  genSlides.forEach((cv, i) => {
    const card = document.createElement('div'); card.className = 'scard';
    const th = document.createElement('canvas');
    th.width = cv.width; th.height = cv.height;
    th.getContext('2d').drawImage(cv, 0, 0);
    card.appendChild(th);

    const ft = document.createElement('div'); ft.className = 'scard-ft';
    const lbl = i === 0 ? 'Capa' : i === genSlides.length - 1 ? 'Final' : `Slide ${i + 1}`;
    ft.innerHTML = `<span class="scard-badge">${lbl}</span>`;

    const dl = document.createElement('button'); dl.className = 'dl1'; dl.innerHTML = '⬇';
    dl.onclick = e => { e.stopPropagation(); dlOne(cv, i + 1); };
    ft.appendChild(dl); card.appendChild(ft);
    card.onclick = () => openM(i);
    grid.appendChild(card);
  });

  document.getElementById('dlAllBtn').style.display = 'flex';
}

// ═══════════════════════════════════════
//  DOWNLOAD
// ═══════════════════════════════════════
function dlOne(cv, n) {
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `slide_${p2(n)}.png`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(a.href);
    showToast(`✓ slide_${p2(n)}.png descarregado`);
  }, 'image/png');
}

async function dlAll() {
  for (let i = 0; i < genSlides.length; i++) {
    await new Promise(r => setTimeout(r, i * 340));
    dlOne(genSlides[i], i + 1);
  }
}

// ═══════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════
function openM(i) { mIdx = i; renderM(); document.getElementById('modal').classList.add('open'); }
function closeM()  { document.getElementById('modal').classList.remove('open'); }

function renderM() {
  const mc = document.getElementById('mCv'), src = genSlides[mIdx];
  mc.width = src.width; mc.height = src.height;
  mc.getContext('2d').drawImage(src, 0, 0);
  document.getElementById('mCtr').textContent = `${mIdx + 1} / ${genSlides.length}`;
  document.getElementById('mPrev').disabled = mIdx === 0;
  document.getElementById('mNext').disabled = mIdx === genSlides.length - 1;
}

// ═══════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════
let _tt = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), 2600);
}

// ═══════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════
document.getElementById('genBtn').onclick    = generate;
document.getElementById('dlAllBtn').onclick  = dlAll;

document.getElementById('copyHashBtn').onclick = () => {
  const v = document.getElementById('hashIn').value.trim();
  if (!v) return;
  navigator.clipboard.writeText(v)
    .then(() => showToast('✓ Hashtags copiadas!'))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = v; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('✓ Hashtags copiadas!');
    });
};

document.getElementById('mClose').onclick = closeM;
document.getElementById('modal').onclick  = e => { if (e.target.id === 'modal') closeM(); };
document.getElementById('mPrev').onclick  = () => { if (mIdx > 0) { mIdx--; renderM(); } };
document.getElementById('mNext').onclick  = () => { if (mIdx < genSlides.length - 1) { mIdx++; renderM(); } };
document.getElementById('mDl').onclick    = () => dlOne(genSlides[mIdx], mIdx + 1);

document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  document.getElementById('mPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('mNext').click();
  if (e.key === 'Escape')     closeM();
});
</script>

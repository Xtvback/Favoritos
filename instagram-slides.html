<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Gerador de Slides Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --app: #0d0d14;
      --panel: #14141f;
      --card: #1c1c2a;
      --border: rgba(255,255,255,0.07);
      --accent: #7c3aed;
      --accent2: #ec4899;
      --text: #f0f0f5;
      --muted: #6b6b85;
      --green: #10b981;
      --r: 12px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--app);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ─── HEADER ─── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 28px;
      background: rgba(124,58,237,.07);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .logo {
      width: 40px; height: 40px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 20px;
    }
    header h1 { font-size: 17px; font-weight: 700; line-height: 1.2; }
    header p  { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ─── LAYOUT ─── */
    main {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: calc(100dvh - 77px);
    }
    @media (max-width: 780px) {
      main { grid-template-columns: 1fr; }
    }

    /* ─── FORM PANEL ─── */
    .form-panel {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }
    .field label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
    }

    input[type="text"], textarea {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 160px; line-height: 1.6; }
    .char-hint { font-size: 11px; color: var(--muted); text-align: right; }

    /* ─── UPLOAD ─── */
    .upload-wrap {
      position: relative;
      border: 2px dashed var(--border);
      border-radius: var(--r);
      min-height: 120px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
      transition: border-color .2s, background .2s;
    }
    .upload-wrap:hover, .upload-wrap.drag { border-color: var(--accent); background: rgba(124,58,237,.05); }
    .upload-wrap input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .upload-icon  { font-size: 28px; pointer-events: none; }
    .upload-hint  { font-size: 12px; color: var(--muted); pointer-events: none; }
    #imgPreview   { max-width:100%; max-height:180px; border-radius:8px; object-fit:cover; display:none; }

    /* ─── THEMES ─── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .theme-btn {
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px 6px 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      transition: transform .15s, border-color .15s;
      line-height: 1.4;
    }
    .theme-btn span { display:block; font-size:20px; margin-bottom:4px; }
    .theme-btn.active { border-color: #fff; transform: scale(1.06); }

    /* ─── GENERATE BTN ─── */
    .gen-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: var(--r);
      cursor: pointer;
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .gen-btn:hover { opacity:.92; transform: translateY(-2px); box-shadow: 0 10px 28px rgba(124,58,237,.4); }
    .gen-btn:active { transform: translateY(0); }

    /* ─── PREVIEW PANEL ─── */
    .preview-panel { padding: 24px 20px; overflow-y: auto; }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .preview-header h2 { font-size: 16px; font-weight: 700; }

    .dl-all-btn {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: rgba(16,185,129,.12);
      color: var(--green);
      border: 1px solid rgba(16,185,129,.25);
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .dl-all-btn:hover { background: rgba(16,185,129,.22); }

    /* ─── EMPTY STATE ─── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      height: 400px;
      color: var(--muted);
      text-align: center;
    }
    .empty-icon { font-size: 56px; opacity: .25; }
    .empty strong { font-size: 15px; color: var(--text); }
    .empty p { font-size: 13px; }

    /* ─── SPINNER ─── */
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 200px;
      color: var(--muted);
    }
    .spin {
      width: 22px; height: 22px;
      border: 2px solid rgba(255,255,255,.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── SLIDES GRID ─── */
    .slides-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }

    .slide-item {
      position: relative;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      aspect-ratio: 1;
    }
    .slide-item:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    .slide-item canvas { width: 100%; height: 100%; display: block; }

    .slide-footer {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 7px 10px;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(4px);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dl-one {
      background: none;
      border: none;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      opacity: .7;
      padding: 2px 4px;
      line-height: 1;
      transition: opacity .15s;
    }
    .dl-one:hover { opacity: 1; }

    /* ─── MODAL ─── */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }

    .modal-box {
      position: relative;
      width: min(520px, 100%);
    }
    .modal-box canvas {
      width: 100%; height: auto;
      border-radius: var(--r);
      display: block;
    }
    .modal-close {
      position: absolute;
      top: -38px; right: 0;
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      opacity: .8;
    }
    .modal-close:hover { opacity: 1; }
    .modal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
    }
    .modal-nav button {
      background: rgba(255,255,255,.1);
      border: none;
      color: #fff;
      padding: 9px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .modal-nav button:hover { background: rgba(255,255,255,.2); }
    .modal-nav button:disabled { opacity: .3; cursor: default; }
    .modal-counter { font-size: 13px; color: var(--muted); }
    .modal-dl {
      background: rgba(16,185,129,.15);
      color: var(--green) !important;
      border: 1px solid rgba(16,185,129,.3) !important;
    }
    .modal-dl:hover { background: rgba(16,185,129,.25) !important; }
  </style>
</head>
<body>

<header>
  <div class="logo">📸</div>
  <div>
    <h1>Gerador de Slides Instagram</h1>
    <p>7 slides profissionais em segundos • 1080×1080 px</p>
  </div>
</header>

<main>
  <!-- ─── FORM ─── -->
  <section class="form-panel">

    <div class="field">
      <label>Imagem de Capa</label>
      <div class="upload-wrap" id="uploadWrap">
        <input type="file" accept="image/*" id="fileInput">
        <div id="uploadPlaceholder">
          <div class="upload-icon">🖼️</div>
          <div class="upload-hint">Clica ou arrasta a imagem aqui</div>
        </div>
        <img id="imgPreview" alt="Capa">
      </div>
    </div>

    <div class="field">
      <label>Título do Post</label>
      <input type="text" id="titleInput" placeholder="Ex: 5 Dicas Para Crescer no Instagram">
    </div>

    <div class="field">
      <label>@Username (opcional)</label>
      <input type="text" id="handleInput" placeholder="@teuinstagram">
    </div>

    <div class="field">
      <label>Conteúdo (dividido nos 6 slides)</label>
      <textarea id="textInput"
        placeholder="Escreve o texto completo aqui. Usa parágrafos separados (linha vazia entre eles) para controlar como o conteúdo fica dividido pelos slides."></textarea>
      <div class="char-hint" id="charCount">0 caracteres</div>
    </div>

    <div class="field">
      <label>Tema</label>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <button class="gen-btn" id="genBtn">
      <span>✨</span>
      <span>Gerar 7 Slides</span>
    </button>

  </section>

  <!-- ─── PREVIEW ─── -->
  <section class="preview-panel">
    <div class="preview-header">
      <h2>Preview dos Slides</h2>
      <button class="dl-all-btn" id="dlAllBtn">⬇ Download Todos</button>
    </div>

    <div class="empty" id="emptyState">
      <div class="empty-icon">📲</div>
      <strong>Os teus slides aparecem aqui</strong>
      <p>Preenche o formulário e clica em "Gerar Slides"</p>
    </div>

    <div class="loading" id="loadingState">
      <div class="spin"></div>
      <span>A gerar slides…</span>
    </div>

    <div class="slides-grid" id="slidesGrid"></div>
  </section>
</main>

<!-- ─── MODAL ─── -->
<div class="modal-bg" id="modalBg">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <canvas id="modalCanvas"></canvas>
    <div class="modal-nav">
      <button id="modalPrev">← Anterior</button>
      <span class="modal-counter" id="modalCounter">1 / 7</span>
      <button class="modal-dl" id="modalDl">⬇ Download</button>
      <button id="modalNext">Próximo →</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  THEMES
// ══════════════════════════════════════════════════════
const THEMES = {
  dark: {
    name:'Escuro', icon:'🖤',
    bg1:'#0a0a0a', bg2:'#141414',
    accent:'#f0c040', text:'#ffffff', sub:'#bbbbbb',
    coverOverlay:'rgba(0,0,0,.58)'
  },
  purple: {
    name:'Roxo', icon:'💜',
    bg1:'#130829', bg2:'#1f0e40',
    accent:'#c084fc', text:'#ffffff', sub:'#ddd6fe',
    coverOverlay:'rgba(19,8,41,.62)'
  },
  white: {
    name:'Branco', icon:'🤍',
    bg1:'#ffffff', bg2:'#f0f0f0',
    accent:'#111111', text:'#111111', sub:'#555555',
    coverOverlay:'rgba(255,255,255,.48)'
  },
  green: {
    name:'Verde', icon:'💚',
    bg1:'#071a12', bg2:'#0e2d1f',
    accent:'#34d399', text:'#ffffff', sub:'#a7f3d0',
    coverOverlay:'rgba(7,26,18,.62)'
  },
  sunset: {
    name:'Pôr do Sol', icon:'🧡',
    bg1:'#180600', bg2:'#2d1000',
    accent:'#fb923c', text:'#ffffff', sub:'#fed7aa',
    coverOverlay:'rgba(24,6,0,.62)'
  },
  ocean: {
    name:'Oceano', icon:'💙',
    bg1:'#040f1c', bg2:'#0a1f35',
    accent:'#38bdf8', text:'#ffffff', sub:'#bae6fd',
    coverOverlay:'rgba(4,15,28,.62)'
  }
};

let activeTheme = 'dark';
let coverImg    = null;
let canvases    = [];
let modalIdx    = 0;

const SIZE = 1080;
const PAD  = 80;

// ══════════════════════════════════════════════════════
//  THEME PICKER
// ══════════════════════════════════════════════════════
function initThemes() {
  const grid = document.getElementById('themeGrid');
  Object.entries(THEMES).forEach(([key, t]) => {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (key === activeTheme ? ' active' : '');
    btn.style.background = `linear-gradient(135deg,${t.bg1},${t.bg2})`;
    btn.style.color = t.text;
    btn.innerHTML = `<span>${t.icon}</span>${t.name}`;
    btn.onclick = () => {
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTheme = key;
    };
    grid.appendChild(btn);
  });
}

// ══════════════════════════════════════════════════════
//  IMAGE UPLOAD
// ══════════════════════════════════════════════════════
function initUpload() {
  const wrap   = document.getElementById('uploadWrap');
  const input  = document.getElementById('fileInput');
  const prev   = document.getElementById('imgPreview');
  const ph     = document.getElementById('uploadPlaceholder');

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        coverImg = img;
        prev.src = ev.target.result;
        prev.style.display = 'block';
        ph.style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  input.addEventListener('change', e => loadFile(e.target.files[0]));
  wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.classList.add('drag'); });
  wrap.addEventListener('dragleave', () => wrap.classList.remove('drag'));
  wrap.addEventListener('drop', e => {
    e.preventDefault();
    wrap.classList.remove('drag');
    loadFile(e.dataTransfer.files[0]);
  });
}

// ══════════════════════════════════════════════════════
//  TEXT SPLITTING
// ══════════════════════════════════════════════════════
function splitText(raw, n) {
  const text = (raw || '').trim();
  if (!text) return Array(n).fill('');

  // Try double-newline paragraphs
  let parts = text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

  // Fall back to single newlines
  if (parts.length < 2)
    parts = text.split(/\n/).map(s => s.trim()).filter(Boolean);

  // Fall back to sentences
  if (parts.length < 2) {
    const m = text.match(/[^.!?]+[.!?]+/g);
    if (m) parts = m.map(s => s.trim()).filter(Boolean);
  }

  // Fall back to word chunks
  if (parts.length < 2) {
    const words = text.split(/\s+/);
    const cs = Math.ceil(words.length / n);
    parts = [];
    for (let i = 0; i < n; i++) {
      const chunk = words.slice(i * cs, (i + 1) * cs).join(' ').trim();
      if (chunk) parts.push(chunk);
    }
  }

  return groupIntoN(parts, n);
}

function groupIntoN(parts, n) {
  if (parts.length === 0) return Array(n).fill('');
  if (parts.length <= n) {
    const r = [...parts];
    while (r.length < n) r.push('');
    return r;
  }
  const result = [];
  const base = Math.floor(parts.length / n);
  const extra = parts.length % n;
  let idx = 0;
  for (let i = 0; i < n; i++) {
    const size = base + (i < extra ? 1 : 0);
    result.push(parts.slice(idx, idx + size).join('\n\n'));
    idx += size;
  }
  return result;
}

// ══════════════════════════════════════════════════════
//  CANVAS HELPERS
// ══════════════════════════════════════════════════════
function newCanvas() {
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  return c;
}

function drawBg(ctx, t) {
  const g = ctx.createLinearGradient(0, 0, 0, SIZE);
  g.addColorStop(0, t.bg1);
  g.addColorStop(1, t.bg2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, SIZE, SIZE);
}

function drawSlideNum(ctx, cur, total, color, dark) {
  ctx.save();
  ctx.font = '500 30px "Inter",sans-serif';
  ctx.fillStyle = dark ? 'rgba(0,0,0,.75)' : color;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(pad2(cur) + ' / ' + pad2(total), SIZE - PAD, PAD + 2);
  ctx.restore();
}

function drawHandle(ctx, handle, color) {
  if (!handle) return;
  const h = handle.startsWith('@') ? handle : '@' + handle;
  ctx.save();
  ctx.font = '500 28px "Inter",sans-serif';
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText(h, PAD, PAD + 2);
  ctx.restore();
}

function drawAccent(ctx, color, x, y) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 90, y);
  ctx.stroke();
  ctx.restore();
}

function pad2(n) { return String(n).padStart(2, '0'); }

function wrapWords(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function drawBodyText(ctx, text, cx, cy, maxW, lh) {
  // Collect all visual lines
  const items = [];
  for (const para of text.split('\n')) {
    if (!para.trim()) { items.push(null); continue; }
    for (const l of wrapWords(ctx, para, maxW)) items.push(l);
  }

  // Remove leading/trailing blank items
  while (items.length && items[0] === null) items.shift();
  while (items.length && items[items.length - 1] === null) items.pop();

  const total = items.reduce((a, l) => a + (l === null ? lh * 0.5 : lh), 0);
  let y = cy - total / 2;

  for (const item of items) {
    if (item === null) { y += lh * 0.5; continue; }
    ctx.fillText(item, cx, y + lh * 0.72);
    y += lh;
  }
}

// ══════════════════════════════════════════════════════
//  SLIDE 1 — COVER
// ══════════════════════════════════════════════════════
function makeCover(title, handle, t) {
  const c = newCanvas();
  const ctx = c.getContext('2d');

  if (coverImg) {
    // Cover-fit the image
    const ia = coverImg.width / coverImg.height;
    let sw, sh, sx, sy;
    if (ia >= 1) {
      sh = SIZE; sw = SIZE * ia;
      sx = -(sw - SIZE) / 2; sy = 0;
    } else {
      sw = SIZE; sh = SIZE / ia;
      sx = 0; sy = -(sh - SIZE) / 2;
    }
    ctx.drawImage(coverImg, sx, sy, sw, sh);

    // Bottom gradient overlay
    const bot = ctx.createLinearGradient(0, SIZE * 0.3, 0, SIZE);
    bot.addColorStop(0, 'rgba(0,0,0,0)');
    bot.addColorStop(.4, t.coverOverlay);
    bot.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = bot;
    ctx.fillRect(0, 0, SIZE, SIZE);

    // Top gradient overlay
    const top = ctx.createLinearGradient(0, 0, 0, SIZE * 0.25);
    top.addColorStop(0, 'rgba(0,0,0,.55)');
    top.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = top;
    ctx.fillRect(0, 0, SIZE, SIZE * 0.25);
  } else {
    drawBg(ctx, t);
    // Decorative circle
    ctx.save();
    ctx.globalAlpha = .06;
    ctx.beginPath();
    ctx.arc(SIZE * .8, SIZE * .2, 400, 0, Math.PI * 2);
    ctx.fillStyle = t.accent;
    ctx.fill();
    ctx.restore();
  }

  // Handle top-left
  drawHandle(ctx, handle, 'rgba(255,255,255,.88)');
  // Slide number top-right
  drawSlideNum(ctx, 1, 7, 'rgba(255,255,255,.8)', false);

  // Accent line above title
  const lineY = SIZE - PAD - 220;
  ctx.save();
  ctx.strokeStyle = t.accent;
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(PAD, lineY);
  ctx.lineTo(PAD + 90, lineY);
  ctx.stroke();
  ctx.restore();

  // Title
  ctx.save();
  ctx.font = '900 84px "Playfair Display",serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  const maxW = SIZE - PAD * 2;
  const titleLines = wrapWords(ctx, title || 'Título do Post', maxW);
  const lh = 98;
  titleLines.forEach((line, i) => {
    ctx.fillText(line, PAD, lineY + 20 + i * lh);
  });
  ctx.restore();

  return c;
}

// ══════════════════════════════════════════════════════
//  SLIDES 2–7 — CONTENT
// ══════════════════════════════════════════════════════
function makeContent(text, num, title, handle, t) {
  const c = newCanvas();
  const ctx = c.getContext('2d');

  drawBg(ctx, t);

  // Subtle bg circle decoration
  ctx.save();
  ctx.globalAlpha = .04;
  ctx.beginPath();
  ctx.arc(SIZE * .88, SIZE * .12, 380, 0, Math.PI * 2);
  ctx.fillStyle = t.accent;
  ctx.fill();
  ctx.restore();

  // Accent bar top-left
  drawAccent(ctx, t.accent, PAD, PAD + 4);

  // Slide number & handle
  drawSlideNum(ctx, num, 7, t.accent, false);
  drawHandle(ctx, handle, t.sub + 'cc');  // slightly transparent

  // Main body text
  ctx.save();
  ctx.font = '400 50px "Inter",sans-serif';
  ctx.fillStyle = t.text;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  drawBodyText(ctx, text || '', SIZE / 2, SIZE / 2, SIZE - PAD * 2.2, 76);
  ctx.restore();

  // Footer: title reference
  if (title) {
    ctx.save();
    ctx.font = 'italic 26px "Playfair Display",serif';
    ctx.fillStyle = t.sub;
    ctx.globalAlpha = .5;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(title, SIZE / 2, SIZE - PAD);
    ctx.restore();
  }

  return c;
}

// ══════════════════════════════════════════════════════
//  GENERATE
// ══════════════════════════════════════════════════════
async function generate() {
  const title  = document.getElementById('titleInput').value.trim();
  const text   = document.getElementById('textInput').value.trim();
  const handle = document.getElementById('handleInput').value.trim();
  const t      = THEMES[activeTheme];

  if (!title && !text) {
    alert('Por favor preenche o título ou o conteúdo!');
    return;
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('loadingState').style.display = 'flex';
  document.getElementById('slidesGrid').innerHTML = '';
  document.getElementById('dlAllBtn').style.display = 'none';
  canvases = [];

  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 80));

  const parts = splitText(text, 6);

  canvases.push(makeCover(title, handle, t));
  for (let i = 0; i < 6; i++) {
    canvases.push(makeContent(parts[i], i + 2, title, handle, t));
  }

  document.getElementById('loadingState').style.display = 'none';

  const labels = ['Capa','Slide 2','Slide 3','Slide 4','Slide 5','Slide 6','Slide 7'];
  const grid = document.getElementById('slidesGrid');

  canvases.forEach((cv, i) => {
    const item = document.createElement('div');
    item.className = 'slide-item';

    const thumb = document.createElement('canvas');
    thumb.width  = cv.width;
    thumb.height = cv.height;
    thumb.getContext('2d').drawImage(cv, 0, 0);
    item.appendChild(thumb);

    const footer = document.createElement('div');
    footer.className = 'slide-footer';

    const lbl = document.createElement('span');
    lbl.textContent = labels[i];

    const dlBtn = document.createElement('button');
    dlBtn.className = 'dl-one';
    dlBtn.title = 'Download';
    dlBtn.innerHTML = '⬇';
    dlBtn.onclick = e => { e.stopPropagation(); downloadOne(cv, i + 1); };

    footer.appendChild(lbl);
    footer.appendChild(dlBtn);
    item.appendChild(footer);

    item.onclick = () => openModal(i);
    grid.appendChild(item);
  });

  const dlAll = document.getElementById('dlAllBtn');
  dlAll.style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  DOWNLOAD
// ══════════════════════════════════════════════════════
function downloadOne(cv, num) {
  cv.toBlob(blob => {
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(blob),
      download: 'slide_' + pad2(num) + '.png'
    });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}

async function downloadAll() {
  for (let i = 0; i < canvases.length; i++) {
    await new Promise(r => setTimeout(r, i * 350));
    downloadOne(canvases[i], i + 1);
  }
}

// ══════════════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════════════
function openModal(idx) {
  modalIdx = idx;
  renderModal();
  document.getElementById('modalBg').classList.add('open');
}

function renderModal() {
  const mc  = document.getElementById('modalCanvas');
  const src = canvases[modalIdx];
  mc.width  = src.width;
  mc.height = src.height;
  mc.getContext('2d').drawImage(src, 0, 0);
  document.getElementById('modalCounter').textContent = (modalIdx + 1) + ' / ' + canvases.length;
  document.getElementById('modalPrev').disabled = modalIdx === 0;
  document.getElementById('modalNext').disabled = modalIdx === canvases.length - 1;
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

// ══════════════════════════════════════════════════════
//  EVENTS
// ══════════════════════════════════════════════════════
document.getElementById('genBtn').onclick    = generate;
document.getElementById('dlAllBtn').onclick  = downloadAll;

document.getElementById('textInput').addEventListener('input', function() {
  document.getElementById('charCount').textContent = this.value.length + ' caracteres';
});

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalBg').onclick = e => {
  if (e.target === document.getElementById('modalBg')) closeModal();
};
document.getElementById('modalPrev').onclick = () => { if (modalIdx > 0) { modalIdx--; renderModal(); } };
document.getElementById('modalNext').onclick = () => { if (modalIdx < canvases.length - 1) { modalIdx++; renderModal(); } };
document.getElementById('modalDl').onclick   = () => downloadOne(canvases[modalIdx], modalIdx + 1);

document.addEventListener('keydown', e => {
  if (!document.getElementById('modalBg').classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  document.getElementById('modalPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('modalNext').click();
  if (e.key === 'Escape')     closeModal();
});

// ──────────────────
initThemes();
initUpload();
</script>
</body>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USLORDS — Base de Dados do Universo</title>
<style>
  /* ========================= RESET & BASE ========================= */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #040608;
    --bg-mid:     #080c12;
    --bg-card:    #0d1520;
    --bg-card2:   #111d2e;
    --border:     #1a2d45;
    --border-glow:#2a4a70;
    --accent:     #6c63ff;
    --accent2:    #00d4ff;
    --text:       #c8d8e8;
    --text-dim:   #5a7a9a;
    --text-bright:#e8f4ff;
    --danger:     #ff4444;
    --success:    #00ff88;
    --glow-purple: rgba(108,99,255,0.15);
    --glow-cyan:   rgba(0,212,255,0.12);
    font-size: 15px;
  }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--border-glow); border-radius: 3px; }

  /* ========================= LOCK SCREEN ========================= */
  #lockscreen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg-deep);
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #lockscreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  /* animated star field */
  #lockscreen::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 10%, rgba(200,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 50%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 60%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 35%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 85%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(200,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 90%, rgba(200,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 55% 45%, rgba(108,99,255,0.7) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 75% 25%, rgba(0,212,255,0.6) 0%, transparent 100%),
      radial-gradient(2px 2px at 20% 40%, rgba(108,99,255,0.5) 0%, transparent 100%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.6; }
    to   { opacity: 1; }
  }

  /* nebula glow background */
  #lockscreen::after {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 30% 40%, rgba(108,99,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 70% 60%, rgba(0,212,255,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .lock-container {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    gap: 2rem;
    animation: lockAppear 1s ease forwards;
  }
  @keyframes lockAppear {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .lock-logo {
    text-align: center;
  }
  .lock-logo .logo-title {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, var(--accent) 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 4s ease infinite;
    filter: drop-shadow(0 0 30px rgba(108,99,255,0.5));
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .lock-logo .logo-sub {
    font-size: 0.7rem;
    letter-spacing: 0.5em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .lock-panel {
    background: rgba(13, 21, 32, 0.9);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 2.5rem 3rem;
    width: min(380px, 90vw);
    backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px rgba(108,99,255,0.1),
      0 0 60px rgba(108,99,255,0.1),
      inset 0 1px 0 rgba(255,255,255,0.05);
    display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
  }

  .lock-label {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* PIN dots display */
  .pin-display {
    display: flex; gap: 1rem; align-items: center;
  }
  .pin-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid var(--border-glow);
    background: transparent;
    transition: all 0.2s ease;
  }
  .pin-dot.filled {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(108,99,255,0.5);
  }
  .pin-dot.error {
    background: var(--danger);
    border-color: var(--danger);
    box-shadow: 0 0 10px var(--danger);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%      { transform: translateX(-6px); }
    40%      { transform: translateX(6px); }
    60%      { transform: translateX(-4px); }
    80%      { transform: translateX(4px); }
  }

  /* numpad */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
    width: 100%;
  }
  .numpad-btn {
    aspect-ratio: 1;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-bright);
    font-size: 1.3rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    user-select: none;
  }
  .numpad-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(108,99,255,0.3), transparent 70%);
    opacity: 0; transition: opacity 0.2s ease;
  }
  .numpad-btn:hover {
    border-color: var(--accent);
    background: rgba(108,99,255,0.1);
    box-shadow: 0 0 15px rgba(108,99,255,0.2);
  }
  .numpad-btn:active { transform: scale(0.94); }
  .numpad-btn:active::after { opacity: 1; }
  .numpad-btn.del { color: var(--text-dim); font-size: 1rem; }
  .numpad-btn.zero { grid-column: 2; }

  .lock-error-msg {
    font-size: 0.75rem;
    color: var(--danger);
    letter-spacing: 0.15em;
    text-align: center;
    min-height: 1em;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .lock-error-msg.visible { opacity: 1; }

  /* ========================= MAIN APP ========================= */
  #app {
    display: none;
    min-height: 100vh;
  }
  #app.visible { display: flex; flex-direction: column; animation: fadeInApp 0.8s ease; }
  @keyframes fadeInApp {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* top bar */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    height: 60px;
    background: rgba(4,6,8,0.95);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(20px);
    display: flex; align-items: center;
    padding: 0 1.5rem;
    gap: 1rem;
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .topbar-logo {
    font-size: 1.2rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    flex-shrink: 0;
  }
  .topbar-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
  .topbar-subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .topbar-spacer { flex: 1; }

  /* search */
  .search-wrap {
    position: relative;
    flex: 1; max-width: 400px;
  }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--text-dim); pointer-events: none;
  }
  #search-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.85rem;
    padding: 0.5rem 0.75rem 0.5rem 2.5rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }
  #search-input::placeholder { color: var(--text-dim); }
  #search-count {
    font-size: 0.7rem; color: var(--text-dim);
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.3rem 0.75rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* lock btn */
  .lock-btn {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-dim); cursor: pointer; padding: 0.5rem;
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.75rem; transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .lock-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lock-btn svg { width: 14px; height: 14px; }

  /* layout */
  .layout { display: flex; flex: 1; min-height: calc(100vh - 60px); }

  /* ========================= SIDEBAR ========================= */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--bg-mid);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    position: sticky; top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
  }
  .sidebar-section-label {
    font-size: 0.6rem;
    letter-spacing: 0.4em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 0 1.25rem 0.75rem;
  }
  .nav-item {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.2s ease;
    position: relative;
  }
  .nav-item:hover { background: rgba(255,255,255,0.03); }
  .nav-item.active {
    background: rgba(108,99,255,0.08);
    border-left-color: var(--accent);
  }
  .nav-item.active .nav-label { color: var(--text-bright); }
  .nav-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    flex-shrink: 0;
  }
  .nav-label { font-size: 0.85rem; color: var(--text); }
  .nav-count {
    margin-left: auto;
    font-size: 0.65rem;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 0.15rem 0.5rem;
    color: var(--text-dim);
  }
  .nav-item.active .nav-count { background: rgba(108,99,255,0.2); color: var(--accent); }

  /* ========================= CONTENT AREA ========================= */
  .content {
    flex: 1;
    padding: 2rem;
    overflow-x: hidden;
  }

  .section-header {
    display: flex; align-items: flex-end; gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap; gap: 0.75rem;
  }
  .section-title {
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 800;
    color: var(--text-bright);
    letter-spacing: 0.05em;
  }
  .section-title span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .section-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.5;
    max-width: 600px;
  }
  .section-line {
    width: 60px; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    margin-top: 0.5rem;
  }

  /* cards grid */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.25rem;
  }

  /* card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--card-color, var(--accent)), transparent);
    opacity: 0.8;
  }
  .card:hover {
    border-color: var(--card-color, var(--accent));
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 20px rgba(108,99,255,0.08);
  }

  .card-header {
    padding: 1.25rem 1.25rem 0.75rem;
    display: flex; align-items: flex-start; gap: 0.75rem;
  }
  .card-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .card-titles { flex: 1; min-width: 0; }
  .card-name {
    font-size: 1rem; font-weight: 700;
    color: var(--text-bright);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 0.7rem; color: var(--text-dim);
    margin-top: 0.15rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-badge {
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    border-radius: 20px;
    padding: 0.2rem 0.6rem;
    border: 1px solid;
    white-space: nowrap; flex-shrink: 0;
  }

  .card-body {
    padding: 0 1.25rem 1.25rem;
  }
  .card-desc {
    font-size: 0.8rem;
    color: var(--text-dim);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.5rem;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 0.65rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.2rem 0.6rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .card-arrow {
    margin-left: auto;
    color: var(--text-dim); font-size: 0.8rem;
    transition: transform 0.2s;
  }
  .card:hover .card-arrow { transform: translateX(4px); color: var(--accent); }

  /* no results */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 4rem 2rem; text-align: center; gap: 1rem;
    grid-column: 1 / -1;
  }
  .empty-icon { font-size: 3rem; opacity: 0.3; }
  .empty-title { font-size: 1rem; color: var(--text-dim); }
  .empty-sub { font-size: 0.8rem; color: var(--text-dim); opacity: 0.6; }

  /* ========================= MODAL ========================= */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(4,6,8,0.85);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    padding: 1rem;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal-overlay.open { opacity: 1; visibility: visible; }

  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 18px;
    width: min(680px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(108,99,255,0.1);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.3s ease;
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-accent-bar {
    height: 4px;
    border-radius: 18px 18px 0 0;
    background: linear-gradient(90deg, var(--modal-color, var(--accent)), var(--accent2));
  }

  .modal-close {
    position: absolute; top: 1.25rem; right: 1.25rem;
    width: 32px; height: 32px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 1.1rem; line-height: 1;
    transition: all 0.2s;
    z-index: 1;
  }
  .modal-close:hover { background: rgba(255,0,0,0.1); border-color: var(--danger); color: var(--danger); }

  .modal-content { padding: 2rem; }

  .modal-header { margin-bottom: 1.5rem; }
  .modal-icon-row {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: 1rem;
  }
  .modal-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
    flex-shrink: 0;
  }
  .modal-title { font-size: 1.5rem; font-weight: 800; color: var(--text-bright); }
  .modal-subtitle { font-size: 0.8rem; color: var(--text-dim); margin-top: 0.25rem; }

  .modal-desc {
    font-size: 0.9rem; line-height: 1.7; color: var(--text);
    margin-bottom: 1.5rem;
    padding: 1rem;
    background: rgba(255,255,255,0.02);
    border-radius: 10px;
    border-left: 3px solid var(--modal-color, var(--accent));
  }

  .modal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .modal-field {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem;
  }
  .modal-field-label {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 0.35rem;
  }
  .modal-field-value {
    font-size: 0.85rem;
    color: var(--text-bright);
    font-weight: 500;
  }

  .modal-list-title {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .modal-tags {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
    margin-bottom: 1.25rem;
  }
  .modal-tag {
    font-size: 0.75rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-glow);
    border-radius: 20px;
    padding: 0.3rem 0.8rem;
    color: var(--text);
  }
  .modal-tag.accent {
    background: rgba(108,99,255,0.1);
    border-color: rgba(108,99,255,0.3);
    color: var(--accent);
  }

  .modal-id {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: monospace;
    opacity: 0.5;
    text-align: right;
    margin-top: 1rem;
  }

  /* ========================= STATUS BADGES ========================= */
  .status-badge {
    display: inline-flex;
    align-items: center; gap: 0.35rem;
    font-size: 0.65rem;
    letter-spacing: 0.08em;
  }
  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-active::before   { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-danger::before   { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }
  .status-neutral::before  { background: #f39c12;        box-shadow: 0 0 6px #f39c12; }
  .status-unknown::before  { background: var(--text-dim); }

  /* ========================= RESPONSIVE ========================= */
  @media (max-width: 768px) {
    .sidebar {
      width: 60px; padding: 1rem 0;
    }
    .nav-label, .nav-count, .sidebar-section-label { display: none; }
    .nav-item { justify-content: center; padding: 0.75rem; }
    .content { padding: 1rem; }
    .topbar-subtitle { display: none; }
    .topbar-divider { display: none; }
    #search-count { display: none; }
  }
  @media (max-width: 480px) {
    .lock-panel { padding: 2rem 1.5rem; }

// ===================== STATE =====================
let currentSection = 'racas';
let searchQuery = '';

// ===================== LOCK LOGIC =====================
const CORRECT_CODE = '2387';
let pinBuffer = '';

function updateDots(error = false) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('dot-' + i);
    d.classList.remove('filled', 'error');
    if (error) d.classList.add('error');
    else if (i < pinBuffer.length) d.classList.add('filled');
  }
}

function handlePin(digit) {
  if (pinBuffer.length >= 4) return;
  pinBuffer += digit;
  updateDots();
  if (pinBuffer.length === 4) {
    if (pinBuffer === CORRECT_CODE) {
      unlock();
    } else {
      updateDots(true);
      document.getElementById('lock-error').classList.add('visible');
      setTimeout(() => {
        pinBuffer = '';
        updateDots();
        document.getElementById('lock-error').classList.remove('visible');
      }, 1200);
    }
  }
}

function handleDel() {
  if (pinBuffer.length > 0) {
    pinBuffer = pinBuffer.slice(0, -1);
    updateDots();
  }
}

function unlock() {
  const ls = document.getElementById('lockscreen');
  const app = document.getElementById('app');
  ls.classList.add('hidden');
  setTimeout(() => {
    app.classList.add('visible');
    initApp();
  }, 600);
}

function lock() {
  pinBuffer = '';
  updateDots();
  document.getElementById('lock-error').classList.remove('visible');
  const app = document.getElementById('app');
  const ls = document.getElementById('lockscreen');
  app.classList.remove('visible');
  app.style.display = 'none';
  ls.classList.remove('hidden');
  ls.style.opacity = '';
  ls.style.visibility = '';
}

document.getElementById('numpad').addEventListener('click', e => {
  const btn = e.target.closest('.numpad-btn');
  if (!btn) return;
  if (btn.id === 'del-btn') handleDel();
  else if (btn.dataset.n !== undefined) handlePin(btn.dataset.n);
});

document.addEventListener('keydown', e => {
  if (document.getElementById('lockscreen').classList.contains('hidden')) return;
  if (e.key >= '0' && e.key <= '9') handlePin(e.key);
  else if (e.key === 'Backspace') handleDel();
});

document.getElementById('lock-again-btn').addEventListener('click', lock);

// ===================== APP INIT =====================
function initApp() {
  // update counts
  Object.keys(SECTIONS).forEach(sec => {
    document.getElementById('count-' + sec).textContent = DB[sec].length;
  });

  // nav clicks
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      currentSection = item.dataset.section;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      searchQuery = '';
      document.getElementById('search-input').value = '';
      renderSection();
    });
  });

  // search
  document.getElementById('search-input').addEventListener('input', e => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderSection();
  });

  // modal close
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  renderSection();
}

// ===================== RENDER =====================
function renderSection() {
  const conf = SECTIONS[currentSection];
  const data = DB[currentSection];
  const filtered = searchQuery
    ? data.filter(e => JSON.stringify(e).toLowerCase().includes(searchQuery))
    : data;

  // update search count
  const countEl = document.getElementById('search-count');
  if (searchQuery) {
    countEl.textContent = filtered.length + ' resultado' + (filtered.length !== 1 ? 's' : '');
    countEl.style.display = '';
  } else {
    countEl.style.display = 'none';
  }

  let html = `
    <div class="section-header">
      <div>
        <div class="section-title"><span>${conf.label}</span></div>
        <div class="section-line"></div>
        <div class="section-desc" style="margin-top:0.5rem">${conf.desc}</div>
      </div>
    </div>
    <div class="cards-grid">
  `;

  if (filtered.length === 0) {
    html += `
      <div class="empty-state">
        <div class="empty-icon">&#128269;</div>
        <div class="empty-title">Nenhum resultado encontrado</div>
        <div class="empty-sub">Tente uma pesquisa diferente</div>
      </div>
    `;
  } else {
    filtered.forEach(entry => {
      const color = entry.imagem_cor || '#6c63ff';
      const tags = conf.getTags(entry);
      const badge = conf.getBadge(entry);
      const badgeClass = conf.getBadgeClass(entry);
      const icon = conf.getIcon(entry);
      const sub = conf.getSubtitle(entry);

      html += `
        <div class="card" style="--card-color:${color}" data-id="${entry.id}" data-section="${currentSection}">
          <div class="card-header">
            <div class="card-icon" style="border-color:${color}22;color:${color}">${icon}</div>
            <div class="card-titles">
              <div class="card-name">${entry.nome}</div>
              <div class="card-sub">${sub}</div>
            </div>
            ${badge ? `<span class="card-badge status-badge ${badgeClass}" style="border-color:currentColor;opacity:0.8">${badge}</span>` : ''}
          </div>
          <div class="card-body">
            <div class="card-desc">${entry.descricao}</div>
          </div>
          ${tags.length ? `
          <div class="card-footer">
            ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
            <span class="card-arrow">&#8594;</span>
          </div>` : `<div class="card-footer"><span class="card-arrow" style="margin-left:auto">&#8594;</span></div>`}
        </div>
      `;
    });
  }

  html += '</div>';
  document.getElementById('main-content').innerHTML = html;

  // attach card click
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const sec = card.dataset.section;
      const entry = DB[sec].find(e => e.id === id);
      if (entry) openModal(entry, sec);
    });
  });
}

// ===================== MODAL =====================
function openModal(entry, section) {
  const conf = SECTIONS[section];
  const color = entry.imagem_cor || '#6c63ff';
  document.getElementById('modal-accent').style.background = `linear-gradient(90deg, ${color}, #00d4ff)`;
  document.getElementById('modal').style.setProperty('--modal-color', color);
  document.getElementById('modal-body').innerHTML = conf.renderModal(entry, color);
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ===================== MODAL RENDERERS =====================
function fieldHtml(label, value) {
  if (!value) return '';
  return `<div class="modal-field"><div class="modal-field-label">${label}</div><div class="modal-field-value">${value}</div></div>`;
}
function listHtml(label, arr) {
  if (!arr || !arr.length) return '';
  return `<div class="modal-list-title">${label}</div><div class="modal-tags">${arr.map(t => `<span class="modal-tag">${t}</span>`).join('')}</div>`;
}

function modalHeader(entry, icon, subtitle, color) {
  return `
    <div class="modal-header">
      <div class="modal-icon-row">
        <div class="modal-icon" style="border-color:${color}44;color:${color}">${icon}</div>
        <div>
          <div class="modal-title">${entry.nome}</div>
          <div class="modal-subtitle">${subtitle || ''}</div>
        </div>
      </div>
    </div>
    <div class="modal-desc">${entry.descricao}</div>
  `;
}

function renderRacaModal(entry, color) {
  const icon = ({ 'Uslords':'&#10024;', 'Velhari':'&#128161;', 'Krath':'&#128480;', 'Sorvani':'&#9881;', 'Thessari':'&#8987;' }[entry.nome] || '&#129422;');
  return modalHeader(entry, icon, entry.subtitulo, color)
    + `<div class="modal-grid">`
    + fieldHtml('Origem', entry.origem)
    + fieldHtml('Esperança de Vida', entry.esperanca_vida)
    + fieldHtml('Populacao', entry.populacao)
    + fieldHtml('Status', entry.status)
    + `</div>`
    + listHtml('Habilidades', entry.habilidades)
    + `<div class="modal-id">ID: ${entry.id}</div>`;
}

function renderPersonagemModal(entry, color) {
  const icon = ({ 'Uslords':'&#10024;', 'Velhari':'&#128161;', 'Krath':'&#128480;', 'Sorvani':'&#9881;', 'Thessari':'&#8987;' }[entry.raca] || '&#128100;');
  let eventosVida = '';
  if (entry.eventos_vida && entry.eventos_vida.length) {
    eventosVida = `<div class="modal-list-title">Eventos de Vida</div><div style="margin-bottom:1rem;">`;
    entry.eventos_vida.forEach(ev => {
      eventosVida += `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);font-size:0.83rem;">
        <div style="min-width:110px;color:${color};font-weight:600;">${ev.ano}${ev.idade !== undefined && ev.idade !== '?' ? ` <span style="color:var(--text-dim);font-weight:400;">(${ev.idade} anos)</span>` : ''}</div>
        <div style="color:var(--text)">${ev.evento}</div>
      </div>`;
    });
    eventosVida += `</div>`;
  }
  return modalHeader(entry, icon, entry.titulo, color)
    + `<div class="modal-grid">`
    + fieldHtml('Raça', entry.raca)
    + fieldHtml('Afiliação', entry.afiliacao)
    + fieldHtml('Status', entry.status)
    + fieldHtml('Nascimento', entry.ano_nascimento)
    + `</div>`
    + listHtml('Habilidades-Chave', entry.habilidades_chave)
    + (entry.historia ? `<div class="modal-list-title">Historia</div><div class="modal-desc" style="display:block;margin-bottom:1rem;font-size:0.85rem;color:var(--text)">${entry.historia}</div>` : '')
    + eventosVida
    + `<div class="modal-id">ID: ${entry.id}</div>`;
}

function renderLugarModal(entry, color) {
  const icons = { 'Dimensão':'&#127300;', 'Planeta':'&#127760;', 'Nebulosa':'&#10024;', 'Estação':'&#128752;', 'Megaestrutura':'&#127968;', 'Sistema':'&#11088;' };
  const key = Object.keys(icons).find(k => (entry.tipo||'').includes(k));
  const icon = key ? icons[key] : '&#127759;';
  return modalHeader(entry, icon, entry.tipo, color)
    + `<div class="modal-grid">`
    + fieldHtml('Sistema', entry.sistema)
    + fieldHtml('Status', entry.status)
    + fieldHtml('Importancia', entry.importancia)
    + `</div>`
    + listHtml('Habitantes', entry.habitantes)
    + `<div class="modal-id">ID: ${entry.id}</div>`;
}

function renderFacaoModal(entry, color) {
  return modalHeader(entry, '&#9873;', entry.tipo, color)
    + `<div class="modal-grid">`
    + fieldHtml('Lider', entry.lider)
    + fieldHtml('Membros Estimados', entry.membros_estimados)
    + `</div>`
    + (entry.objetivo ? `<div class="modal-list-title">Objetivo</div><div class="modal-desc" style="display:block;margin-bottom:1rem;font-size:0.85rem;color:var(--text)">${entry.objetivo}</div>` : '')
    + listHtml('Aliancas', entry.aliancas)
    + listHtml('Conflitos', entry.conflitos)
    + `<div class="modal-id">ID: ${entry.id}</div>`;
}

function renderEventoModal(entry, color) {
  const icons = { 'Conflito':'&#9876;', 'Cósmico':'&#10024;', 'Tecnológico':'&#9881;', 'Misterioso':'&#10067;', 'Histórico':'&#128214;' };
  const key = Object.keys(icons).find(k => (entry.tipo||'').includes(k));
  const icon = key ? icons[key] : '&#128336;';
  return modalHeader(entry, icon, entry.tipo, color)
    + `<div class="modal-grid">`
    + fieldHtml('Periodo', entry.periodo)
    + fieldHtml('Status', entry.status)
    + `</div>`
    + listHtml('Participantes', entry.participantes)
    + listHtml('Consequencias', entry.consequencias)
    + `<div class="modal-id">ID: ${entry.id}</div>`;
}
</script>
</body>
</html>
